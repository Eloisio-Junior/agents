name: Deploy Swagger UI to GitHub Pages

# Publishes the committed openapi.json (kept in sync by `bun openapi:check`, see
# scripts/build-openapi.ts) as a Swagger UI page on GitHub Pages. Free-edition only: the derivation
# tooling drops THIS WORKFLOW from the Pro tree (openapi.json itself ships in both), and the job is
# additionally guarded to the public Free repo so it no-ops if it ever reaches the master or a fork.
#
# NOTE: Pages must be enabled on the repo with "GitHub Actions" as the source, or `configure-pages`
# fails with "Get Pages site failed". It cannot self-enable: the action's `enablement` input needs a
# token other than GITHUB_TOKEN. Pages on a private repo also requires a paid plan, which is why
# this job only ever succeeded after fazer-ai/agents went public.
on:
  push:
    branches:
      - main
    paths:
      - "openapi.json"
      - ".github/workflows/deploy-swagger.yml"
  workflow_dispatch:

# Serialize Pages deploys; never cancel an in-flight publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.repository == 'fazer-ai/agents'

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Create Swagger UI index.html
        run: |
          mkdir -p ./public
          cat <<EOL > ./public/index.html
          <!DOCTYPE html>
          <html lang="en">
          <head>
              <meta charset="UTF-8">
              <title>fazer.ai agents API</title>
              <link rel="stylesheet" type="text/css" href="https://unpkg.com/swagger-ui-dist@5.9.0/swagger-ui.css">
              <link rel="icon" type="image/png" href="https://unpkg.com/swagger-ui-dist@5.9.0/favicon-32x32.png" sizes="32x32">
              <link rel="icon" type="image/png" href="https://unpkg.com/swagger-ui-dist@5.9.0/favicon-16x16.png" sizes="16x16">
              <style>
                  html { box-sizing: border-box; overflow: -moz-scrollbars-vertical; overflow-y: scroll; }
                  *, *:before, *:after { box-sizing: inherit; }
                  body { margin:0; background: #fafafa; }
              </style>
          </head>
          <body>
              <div id="swagger-ui"></div>

              <script src="https://unpkg.com/swagger-ui-dist@5.9.0/swagger-ui-bundle.js" defer></script>
              <script src="https://unpkg.com/swagger-ui-dist@5.9.0/swagger-ui-standalone-preset.js" defer></script>

              <script>
              document.addEventListener('DOMContentLoaded', function() {
                  window.ui = SwaggerUIBundle({
                      url: "openapi.json",
                      dom_id: '#swagger-ui',
                      deepLinking: true,
                      presets: [
                          SwaggerUIBundle.presets.apis,
                          SwaggerUIStandalonePreset
                      ],
                      plugins: [
                          SwaggerUIBundle.plugins.DownloadUrl
                      ],
                      layout: "StandaloneLayout"
                  });
              });
              </script>
          </body>
          </html>
          EOL
          cp openapi.json ./public/openapi.json

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: './public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
